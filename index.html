<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <div class="logo">
                <div class="logo-icon">U</div>
                <div>
                    <h2>UserHub</h2>
                    <p>Management Dashboard</p>
                </div>
            </div>

            <span class="status">● System Active</span>
        </header>

        <section class="hero">
            <div>
                <span class="tag">USER MANAGEMENT</span>
                <h1>Manage Your <span>Team</span></h1>
                <p>Create, organize and manage your users in one place.</p>
            </div>
        </section>

        <section class="content">

            <div class="form-section">

                <div class="section-heading">
                    <div>
                        <h2>Add New User</h2>
                        <p>Enter user information below</p>
                    </div>
                    <span class="form-icon">+</span>
                </div>

                <form id="userForm">

                    <div class="input-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="e.g. John Doe" required>
                    </div>

                    <div class="input-group">
                        <label for="role">Professional Role</label>
                        <input type="text" id="role" placeholder="e.g. Frontend Developer" required>
                    </div>

                    <div class="input-group">
                        <label for="desc">Description</label>
                        <textarea id="desc" placeholder="Write something about this user..." required></textarea>
                    </div>

                    <div class="input-group">
                        <label for="img">Profile Image URL</label>
                        <input type="url" id="img" placeholder="https://example.com/image.jpg" required>
                    </div>

                    <button type="submit" class="submit-btn">
                        <span>+</span> Add New User
                    </button>

                </form>
            </div>

            <div class="users-section">

                <div class="users-heading">
                    <div>
                        <span class="tag">YOUR COMMUNITY</span>
                        <h2>Team Members</h2>
                        <p>All registered users appear here.</p>
                    </div>
                </div>

                <div class="user-container" id="userContainer">
                </div>

            </div>

        </section>

        <footer>
            <p>© 2026 UserHub. All rights reserved.</p>
        </footer>

    </main>

    <script src="script.js"></script>
</body>

</html>
