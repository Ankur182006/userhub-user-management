<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee ID Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --ink: #101526;
            --muted: #72798a;
            --line: #e8eaef;
            --blue: #3157db;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow-x: hidden;
            font-family: "DM Sans", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.95) 0 5%, transparent 18%),
                radial-gradient(circle at 88% 82%, rgba(217, 223, 255, 0.7), transparent 24%),
                #f1f3f8;
        }

        .id-card {
            width: min(390px, calc(100vw - 32px));
            min-height: 620px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(20, 26, 45, 0.06);
            border-radius: 28px;
            background: #fff;
            box-shadow: 0 28px 70px rgba(35, 43, 78, 0.16);
        }

        .card-header {
            height: 178px;
            position: relative;
            background:
                linear-gradient(135deg, rgba(49, 87, 219, 0.95), rgba(87, 120, 232, 0.88)),
                #3157db;
        }

        .card-header::before,
        .card-header::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.16);
        }

        .card-header::before {
            width: 210px;
            height: 210px;
            right: -92px;
            top: -128px;
            box-shadow: 0 0 0 24px rgba(255, 255, 255, 0.035);
        }

        .card-header::after {
            width: 90px;
            height: 90px;
            right: 34px;
            bottom: -68px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            position: absolute;
            top: 26px;
            left: 28px;
            color: #fff;
        }

        .brand-mark {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
        }

        .brand-mark svg {
            width: 22px;
        }

        .brand-name {
            font-family: "Manrope", sans-serif;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.02em;
        }

        .brand-name span {
            display: block;
            margin-top: 2px;
            font-family: "DM Sans", sans-serif;
            font-size: 8px;
            font-weight: 600;
            letter-spacing: 0.21em;
            opacity: 0.72;
        }

        .profile-photo {
            width: 142px;
            height: 142px;
            position: absolute;
            z-index: 2;
            left: 50%;
            bottom: -71px;
            transform: translateX(-50%);
            padding: 7px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 12px 30px rgba(27, 39, 91, 0.17);
        }

        .profile-photo img {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 50%;
            object-fit: cover;
            background: #dde3ef;
        }

        .card-body {
            padding: 88px 34px 28px;
            text-align: center;
        }

        .employee-name {
            margin: 0;
            font-family: "Manrope", sans-serif;
            font-size: 25px;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        .employee-role {
            margin: 7px 0 0;
            color: var(--blue);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .employee-id {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-top: 11px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #35b98a;
            box-shadow: 0 0 0 3px #e7f7f1;
        }

        .divider {
            height: 1px;
            margin: 24px 0 20px;
            background: var(--line);
        }

        .details {
            display: grid;
            gap: 15px;
            text-align: left;
        }

        .detail {
            display: grid;
            grid-template-columns: 34px 1fr;
            align-items: center;
            gap: 11px;
        }

        .detail-icon {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            color: var(--blue);
            background: #f1f4ff;
        }

        .detail-icon svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .detail-label {
            display: block;
            margin-bottom: 2px;
            color: #a0a5b2;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .detail-value {
            display: block;
            overflow: hidden;
            color: #30374a;
            font-size: 13px;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-footer {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 24px -34px -28px;
            padding: 0 34px;
            border-top: 1px solid var(--line);
            background: #fbfcff;
        }

        .validity {
            color: #999fad;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .validity strong {
            display: block;
            margin-top: 3px;
            color: #343b4d;
            font-size: 11px;
            letter-spacing: 0;
            text-transform: none;
        }

        .barcode {
            display: flex;
            align-items: end;
            gap: 2px;
            height: 28px;
        }

        .barcode i {
            width: 2px;
            display: block;
            background: #252a38;
        }

        .barcode i:nth-child(2n) {
            height: 21px;
        }

        .barcode i:nth-child(3n) {
            height: 27px;
            width: 3px;
        }

        .barcode i:nth-child(5n) {
            height: 17px;
        }

        .barcode i:nth-child(7n) {
            height: 24px;
            width: 1px;
        }

        @media (max-width: 420px) {
            .id-card {
                min-height: 600px;
            }

            .card-body {
                padding-inline: 26px;
            }

            .card-footer {
                margin-inline: -26px;
                padding-inline: 26px;
            }
        }
    </style>
</head>

<body>
    <main class="id-card" aria-label="Employee ID card">

    </main>
    <script src="script.js"></script>
</body>

</html>
